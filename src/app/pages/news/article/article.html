<article class="article-card">
    @if (article().image) {
        <div class="article-card__image">
            <img
                [ngSrc]="article().image"
                [alt]="article().title"
                fill
            />
        </div>
    }
    <div class="article-card__body">
        <header class="article-card__header">
            <div class="article-card__source">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2" />
                </svg>
                {{ article().source.name }}
            </div>
            <h3 class="article-card__title">{{ article().title }}</h3>
        </header>
        <details class="article-card__details">
            <summary class="article-card__summary">{{ article().description }}</summary>
            <p class="article-card__content">{{ article().content }}</p>
        </details>
        <footer class="article-card__footer">
            <span class="article-card__date">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                    <line x1="16" y1="2" x2="16" y2="6" />
                    <line x1="8" y1="2" x2="8" y2="6" />
                    <line x1="3" y1="10" x2="21" y2="10" />
                </svg>
                {{ article().publishedAt | date : 'MMM d, y' }}
            </span>
            <a
                [href]="article().url"
                target="_blank"
                rel="noopener noreferrer"
                class="article-card__cta"
                aria-label="Read full article: {{ article().title }}"
            >
                Read more
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="5" y1="12" x2="19" y2="12" />
                    <polyline points="12 5 19 12 12 19" />
                </svg>
            </a>
        </footer>
    </div>
</article>
